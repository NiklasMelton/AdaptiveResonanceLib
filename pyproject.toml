[project]
name = "artlib"
version = "0.1.10"
description = "A Python library for Adaptive Resonance Theory (ART) algorithms."
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "MIT"
authors = [{ name = "Niklas M. Melton", email = "niklasmelton@gmail.com" }]
keywords = ["adaptive resonance theory", "ART", "machine learning", "neural networks", "clustering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.19.4",
  "scipy>=1.5.4",
  "scikit-learn>=1.0",
  "matplotlib>=3.3.3",
  "numba>=0.57.0; python_version < '3.13'",
  "numba>=0.61.0; python_version >= '3.13' and python_version < '3.14'",
  "numba>=0.63.0; python_version >= '3.14' and python_version < '3.15'",
]

[project.urls]
Homepage = "https://github.com/NiklasMelton/AdaptiveResonanceLib"
Repository = "https://github.com/NiklasMelton/AdaptiveResonanceLib"
Documentation = "https://github.com/NiklasMelton/AdaptiveResonanceLib"

[project.optional-dependencies]
torch = [
  "torch>=1.10; python_version < '3.14'",
  "torch>=2.10; python_version >= '3.14' and python_version < '3.15'",
]

[tool.pytest.ini_options]
markers = ["heavy: slow/expensive tests"]
testpaths = ["unit_tests"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pre-commit = "^4.0.0"
torch = [
  { version = ">=1.10", markers = "python_version < '3.14'" },
  { version = ">=2.10", markers = "python_version >= '3.14' and python_version < '3.15'" },
]
pandas = ">=1.1.5"

[tool.poetry.group.docs.dependencies]
sphinx = "^6.2.1"
sphinx-rtd-theme = "^1.0.0"  # If you're using the Read the Docs theme
sphinx-autoapi = ">=3.0.0"
myst-parser = "^1.0"
cffconvert = "^2.0.0"
sphinxcontrib-bibtex = "^2.0.0"

[build-system]
requires = ["scikit-build-core>=1.0,<2", "pybind11>=3.0,<4"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "1.0"
wheel.packages = ["artlib"]
wheel.exclude = ["**/*.cpp", "**/*.hpp", "**/*.ipynb", "**/*.gif", "**/*.csv", "**/.DS_Store", "**/.ipynb_checkpoints/**"]
sdist.inclusion-mode = "explicit"
sdist.include = [
  "pyproject.toml",
  "CMakeLists.txt",
  "README.md",
  "LICENSE",
  "artlib/**/*.py",
  "artlib/optimized/backends/cpp/*.cpp",
  "artlib/optimized/backends/cpp/*.hpp",
]
