name: Run Python Unit Tests

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  package_changes:
    name: Detect packaging changes
    runs-on: ubuntu-latest
    outputs:
      package_smoke: ${{ steps.filter.outputs.package_smoke }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect packaging paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            package_smoke:
              - '.github/workflows/pytest.yml'
              - 'pyproject.toml'
              - 'poetry.lock'

  build_wheels:
    name: Build wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [package_changes]
    if: github.base_ref == 'main' && needs.package_changes.outputs.package_smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: [package_changes]
    if: github.base_ref == 'main' && needs.package_changes.outputs.package_smoke == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist --outdir dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist-artifact
          path: dist/*.tar.gz

  install_smoke:
    name: Install smoke test (${{ matrix.package-format }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [package_changes, build_wheels, build_sdist]
    if: github.base_ref == 'main' && needs.package_changes.outputs.package_smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
            package-format: 'wheel'
          - python-version: '3.10'
            package-format: 'wheel'
          - python-version: '3.11'
            package-format: 'wheel'
          - python-version: '3.12'
            package-format: 'wheel'
          - python-version: '3.13'
            package-format: 'wheel'
          - python-version: '3.14'
            package-format: 'wheel'
          - python-version: '3.9'
            package-format: 'sdist'
          - python-version: '3.10'
            package-format: 'sdist'
          - python-version: '3.11'
            package-format: 'sdist'
          - python-version: '3.12'
            package-format: 'sdist'
          - python-version: '3.13'
            package-format: 'sdist'
          - python-version: '3.14'
            package-format: 'sdist'

    steps:
      - name: Download wheel artifact
        if: matrix.package-format == 'wheel'
        uses: actions/download-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist

      - name: Download sdist artifact
        if: matrix.package-format == 'sdist'
        uses: actions/download-artifact@v4
        with:
          name: sdist-artifact
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package from artifact
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ "${{ matrix.package-format }}" = "wheel" ]; then
            python -m pip install --no-cache-dir dist/artlib-*.whl
          else
            python -m pip install --no-cache-dir dist/*.tar.gz
          fi

      - name: Import smoke test
        run: |
          python -c "import artlib; import artlib.elementary.BayesianART; import artlib.optimized.backends.cpp.cppBinaryFuzzyARTMAP"

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [package_changes, install_smoke]
    if: always() && (github.base_ref != 'main' || needs.package_changes.outputs.package_smoke != 'true' || needs.install_smoke.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1) Compute which "areas" changed — one filter per test file
      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # Runs test_FuzzyARTMAP_factories.py when any of these change:
            fuzzy_factory:
              - 'artlib/common/BaseART.py'
              - 'artlib/common/BaseARTMAP.py'
              - 'artlib/elementary/FuzzyART.py'
              - 'artlib/supervised/SimpleARTMAP.py'
              - 'artlib/optimized/FuzzyARTMAPFactory.py'
              - 'artlib/optimized/backends/cpp/cppFuzzyARTMAP.cpp'
              - 'artlib/optimized/backends/cpp/FuzzyARTMAP.py'
              - 'artlib/optimized/backends/torch/FuzzyARTMAP.py'
              - 'artlib/optimized/backends/torch/_TorchSimpleARTMAP.py'
              - 'unit_tests/test_FuzzyARTMAP_factories.py'
              - 'pyproject.toml'
              - 'poetry.lock'

            # Runs test_HypersphereARTMAP_factories.py when these change:
            hypersphere_factory:
              - 'artlib/common/BaseART.py'
              - 'artlib/common/BaseARTMAP.py'
              - 'artlib/elementary/HypersphereART.py'
              - 'artlib/supervised/SimpleARTMAP.py'
              - 'artlib/optimized/HypersphereARTMAPFactory.py'
              - 'artlib/optimized/backends/cpp/cppHypersphereARTMAP.cpp'
              - 'artlib/optimized/backends/cpp/HypersphereARTMAP.py'
              - 'artlib/optimized/backends/torch/HypersphereARTMAP.py'
              - 'artlib/optimized/backends/torch/_TorchSimpleARTMAP.py'
              - 'unit_tests/test_HypersphereARTMAP_factories.py'
              - 'pyproject.toml'
              - 'poetry.lock'

            # Add more test-specific filters here as needed...
            gaussian_factory:
              - 'artlib/common/BaseART.py'
              - 'artlib/common/BaseARTMAP.py'
              - 'artlib/elementary/GaussianART.py'
              - 'artlib/supervised/SimpleARTMAP.py'
              - 'artlib/optimized/GaussianARTMAPFactory.py'
              - 'artlib/optimized/backends/cpp/cppGaussianARTMAP.cpp'
              - 'artlib/optimized/backends/cpp/GaussianARTMAP.py'
              - 'artlib/optimized/backends/torch/GaussianARTMAP.py'
              - 'artlib/optimized/backends/torch/_TorchSimpleARTMAP.py'
              - 'unit_tests/test_GaussianARTMAP_factories.py'
              - 'pyproject.toml'
              - 'poetry.lock'

            # Add more test-specific filters here as needed...
            binary_factory:
              - 'artlib/common/BaseART.py'
              - 'artlib/common/BaseARTMAP.py'
              - 'artlib/elementary/BinaryFuzzyART.py'
              - 'artlib/supervised/SimpleARTMAP.py'
              - 'artlib/optimized/BinaryFuzzyARTMAPFactory.py'
              - 'artlib/optimized/backends/cpp/cppBinaryFuzzyARTMAP.cpp'
              - 'artlib/optimized/backends/cpp/BinaryFuzzyARTMAP.py'
              - 'artlib/optimized/backends/torch/BinaryFuzzyARTMAP.py'
              - 'artlib/optimized/backends/torch/_TorchSimpleARTMAP.py'
              - 'unit_tests/test_BinaryFuzzyARTMAP_factories.py'
              - 'pyproject.toml'
              - 'poetry.lock'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev --no-root

      - name: Build wheel
        run: |
          poetry build
          ls -l dist

      - name: Install wheel
        run: |
          poetry run pip install dist/*.whl

      - name: Debug installed 'artlib'
        run: |
          poetry run pip show -f artlib

      # 2) Fast suite (always runs) — exclude the factory tests so they don’t double-run
      - name: Run fast tests
        id: run_fast
        shell: bash
        run: |
          set -euo pipefail
          poetry run pytest unit_tests/ \
            --ignore-glob='unit_tests/test_*ARTMAP_factories.py' \
            --maxfail=5 \
            --disable-warnings \
            -v \
            --tb=short \
            --junitxml=./test-results/pytest-fast.xml \
            2>&1 | tee pytest-fast.log

      - name: Upload fast results (on failure)
        if: ${{ always() && steps.run_fast.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-fast-results-py${{ matrix.python-version }}
          path: |
            pytest-fast.log
            ./test-results/pytest-fast.xml
          compression-level: 6
          if-no-files-found: ignore

      # 3) Each heavy test runs only if its filter matched

      - name: Run Fuzzy factory test
        id: run_fuzzy
        if: steps.changes.outputs.fuzzy_factory == 'true'
        shell: bash
        run: |
          set -euo pipefail
          poetry run pytest unit_tests/test_FuzzyARTMAP_factories.py \
            --maxfail=5 \
            --disable-warnings \
            -v \
            --tb=short \
            --junitxml=./test-results/pytest-fuzzy-factory.xml \
            2>&1 | tee pytest-fuzzy-factory.log

      - name: Upload Fuzzy factory results (on failure)
        if: ${{ always() && steps.run_fuzzy.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-fuzzy-factory-results-py${{ matrix.python-version }}
          path: |
            pytest-fuzzy-factory.log
            ./test-results/pytest-fuzzy-factory.xml
          compression-level: 6
          if-no-files-found: ignore


      - name: Run Hypersphere factory test
        id: run_hypersphere
        if: steps.changes.outputs.hypersphere_factory == 'true'
        shell: bash
        run: |
          set -euo pipefail
          poetry run pytest unit_tests/test_HypersphereARTMAP_factories.py \
            --maxfail=5 \
            --disable-warnings \
            -v \
            --tb=short \
            --junitxml=./test-results/pytest-hypersphere-factory.xml \
            2>&1 | tee pytest-hypersphere-factory.log

      - name: Upload Hypersphere factory results (on failure)
        if: ${{ always() && steps.run_hypersphere.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-hypersphere-factory-results-py${{ matrix.python-version }}
          path: |
            pytest-hypersphere-factory.log
            ./test-results/pytest-hypersphere-factory.xml
          compression-level: 6
          if-no-files-found: ignore


      - name: Run Gaussian factory test
        id: run_gaussian
        if: steps.changes.outputs.gaussian_factory == 'true'
        shell: bash
        run: |
          set -euo pipefail
          poetry run pytest unit_tests/test_GaussianARTMAP_factories.py \
            --maxfail=5 \
            --disable-warnings \
            -v \
            --tb=short \
            --junitxml=./test-results/pytest-gaussian-factory.xml \
            2>&1 | tee pytest-gaussian-factory.log

      - name: Upload Gaussian factory results (on failure)
        if: ${{ always() && steps.run_gaussian.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-gaussian-factory-results-py${{ matrix.python-version }}
          path: |
            pytest-gaussian-factory.log
            ./test-results/pytest-gaussian-factory.xml
          compression-level: 6
          if-no-files-found: ignore


      - name: Run Binary Fuzzy factory test
        id: run_binary
        if: steps.changes.outputs.binary_factory == 'true'
        shell: bash
        run: |
          set -euo pipefail
          poetry run pytest unit_tests/test_BinaryFuzzyARTMAP_factories.py \
            --maxfail=5 \
            --disable-warnings \
            -v \
            --tb=short \
            --junitxml=./test-results/pytest-binary-factory.xml \
            2>&1 | tee pytest-binary-factory.log

      - name: Upload Binary Fuzzy factory results (on failure)
        if: ${{ always() && steps.run_binary.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-binary-factory-results-py${{ matrix.python-version }}
          path: |
            pytest-binary-factory.log
            ./test-results/pytest-binary-factory.xml
          compression-level: 6
          if-no-files-found: ignore
