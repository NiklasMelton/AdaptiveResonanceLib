name: Run ARTMAP Factory Tests

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      # Source files whose changes should trigger the tests
      - "artlib/optimized/*.py"
      - "artlib/optimized/backends/*.py"
      - "artlib/optimized/backends/cpp/*.py"
      - "artlib/optimized/backends/cpp/*.cpp"
      - "artlib/optimized/backends/torch/*.py"
      - "unit_tests/test_*ARTMAP_factories.py"
      - "pyproject.toml"
      - "poetry.lock"

jobs:
  heavy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev --no-root

      - name: Build wheel
        run: |
          poetry build
          ls -l dist

      - name: Install wheel
        run: |
          poetry run pip install dist/*.whl

      - name: Debug installed 'artlib'
        run: |
          poetry run pip show -f artlib

      - name: Run ARTMAP factory tests
        run: |
          poetry run pytest unit_tests/test_*ARTMAP_factories.py \
            --maxfail=5 --disable-warnings -v --tb=short \
            --junitxml=./test-results/pytest-heavy.xml

      - name: Publish test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-heavy-results
          path: ./test-results/pytest-artmap-factories.xml
          compression-level: 6
