name: ChatGPT PR Review

on:
  pull_request_target:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  review:
    if: >
      contains(github.event.pull_request.labels.*.name, 'chatgpt-review') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "openai>=2,<3" "requests>=2.32,<3"

      - name: Run ChatGPT review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_LABEL: chatgpt-review
        run: python scripts/chatgpt_pr_review.py
