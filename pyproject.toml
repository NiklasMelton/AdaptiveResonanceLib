[project]
name        = "artlib"
version     = "0.1.9"
description = "A Python library for Adaptive Resonance Theory (ART) algorithms."
readme      = { file = "README.md", "content-type" = "text/markdown" }
requires-python = ">=3.9,<3.15"
dependencies = [
  "numpy>=1.19.4",
  "scipy>=1.5.4",
  "scikit-learn>=1.0",
  "matplotlib>=3.3.3",
  "numba>=0.57.0",
]

[project.optional-dependencies]
torch = [
  "torch>=1.10; python_version < '3.14'",
  "torch>=2.10; python_version >= '3.14' and python_version < '3.15'",
]

[tool.poetry]
name = "artlib"
version = "0.1.9"
description = "A Python library for Adaptive Resonance Theory (ART) algorithms."
authors = ["Niklas M. Melton <niklasmelton@gmail.com>"]
license = "MIT"
homepage = "https://github.com/NiklasMelton/AdaptiveResonanceLib"
repository = "https://github.com/NiklasMelton/AdaptiveResonanceLib"
documentation = "https://github.com/NiklasMelton/AdaptiveResonanceLib"
readme = "README.md"
keywords = ["adaptive resonance theory", "ART", "machine learning", "neural networks", "clustering"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.pytest.ini_options]
markers = ["heavy: slow/expensive tests"]
testpaths = ["unit_tests"]

[tool.poetry.dependencies]
python = ">=3.9,<3.15"
numpy = ">=1.19.4"
scipy = ">=1.5.4"
scikit-learn = ">=1.0"
matplotlib = ">=3.3.3"
numba = ">=0.57.0"
torch = [
  { version = ">=1.10", optional = true, markers = "python_version < '3.14'" },
  { version = ">=2.10", optional = true, markers = "python_version >= '3.14' and python_version < '3.15'" },
]

[tool.poetry.extras]
torch = ["torch"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pre-commit = "^4.0.0"
torch = [
  { version = ">=1.10", markers = "python_version < '3.14'" },
  { version = ">=2.10", markers = "python_version >= '3.14' and python_version < '3.15'" },
]
pandas = ">=1.1.5"

[tool.poetry.group.docs.dependencies]
sphinx = "^6.2.1"
sphinx-rtd-theme = "^1.0.0"  # If you're using the Read the Docs theme
sphinx-autoapi = ">=3.0.0"
myst-parser = "^1.0"
cffconvert = "^2.0.0"
sphinxcontrib-bibtex = "^2.0.0"

[build-system]
requires = [
  "poetry-core>=1.0.0",
  "setuptools>=61.0",
  "wheel",
  "pybind11>=3.0"
]
build-backend = "setuptools.build_meta"
